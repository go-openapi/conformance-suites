name: integration test

permissions:
  pull-requests: read
  contents: read

on:
  push:
    branches:
      - master

  pull_request:

jobs:
  test:
    # The YAML 1.2 reference parser and libfyaml, which yaml/consensus and yaml/calibrate read documents with.
    # The libfyaml wheel is manylinux, so this runs on Linux only.
    name: integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          check-latest: true
          cache: true
          cache-dependency-path: '**/go.sum'

      - name: Install the reference parsers
        # Each script ends with --check, so a failed install fails here instead of skipping the tests.
        run: |
          hack/conformance/install-reference-parser.sh
          hack/conformance/install-libfyaml.sh

      - name: Run integration tests
        run: >
          go test
          -v
          -count 1
          -timeout 30m
          -coverprofile='integration.coverage.${{ matrix.os }}.out'
          -covermode=atomic
          -coverpkg=github.com/go-openapi/conformance-suites/...
          ./yaml/consensus/...
          ./yaml/calibrate/...

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: '*.coverage.*.out'
          name: 'integration.coverage.${{ matrix.os }}'
          retention-days: 1

  # Single gate job for branch protection rules
  integration-test:
    name: integration test
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix results
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Matrix jobs failed or were cancelled"
            exit 1
          fi

  collect-coverage:
    needs: [integration-test]
    if: ${{ !cancelled() && needs.integration-test.result == 'success' }}
    uses: go-openapi/ci-workflows/.github/workflows/collect-coverage.yml@692da2dae8f16666dea2392b18ad73130fbf738e # v0.6.5
    secrets: inherit
