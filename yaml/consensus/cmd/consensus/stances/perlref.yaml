# The stance of the YAML 1.2 reference parser, read through its event output.
parser: perlref
at: parse
because: >-
  the YAML 1.2 reference parser (yaml/yaml-reference-parser, Perl), generated from the spec's grammar productions;
  the runner reads its events, and it builds no values

stands:
  key/duplicate:
    stand: either
    because: >-
      the grammar has no production against a key written twice, and the reference parser implements the grammar
      alone, so it does not check this settled rule

# The reference parser implements the productions that shape a document and leaves several character-level checks
# out. Each departure below accepts documents the corpus grammar rejects.
departures:
  - id: bytes-not-utf8
    accepts: invalid
    match: {tags: [encoding/not-utf8]}
    kind: leniency
    because: the parser does not check that its input is UTF-8
  - id: bom-anywhere
    accepts: invalid
    match: {tags: [encoding/bom]}
    kind: leniency
    because: the parser takes a byte order mark where the grammar allows none
  - id: escape-unchecked
    accepts: invalid
    match:
      src: '\\(?:x[0-9A-Fa-f]?[^0-9A-Fa-f]|u[0-9A-Fa-f]{0,3}[^0-9A-Fa-f]|U[0-9A-Fa-f]{0,7}[^0-9A-Fa-f]|[^0abtnvfre "/\\N_LPxuU\t\r\n])'
    kind: leniency
    because: >-
      the parser takes a double-quoted escape without checking it: \x with fewer than two hex digits, \u with
      fewer than four, a letter no escape names
  - id: yaml-directive-unchecked
    accepts: invalid
    match:
      src: '(?m)^%YAML(?:[ \t]*$|[^ \t]|[ \t]+(?:[^0-9 \t]|[0-9]+(?:$|[^.0-9]|\.(?:$|[^0-9]|[0-9]+[^0-9 \t\r\n#]))))'
    kind: leniency
    because: the parser does not check the version number of a %YAML directive

# The reference parser shares a grammar lineage with YAMLStar's, and rejects the same documents for the same causes.
# Its adapter keeps no message, so these departures match the source alone.
  - id: lone-cr-break
    rejects: valid
    match:
      src: '\r([^\n]|$)'
    kind: defect
    because: >-
      the parser takes a lone CR as a line break in some places and not in others: "x\r\r", "x\r# c", "!foo\r- a",
      "\r!" and an empty line written "\n\r" reject the document, where [28] b-break takes a lone CR. Any valid
      document holding a lone CR is covered, so a defect of another kind in such a document is hidden
  - id: json-key-properties-adjacent-value
    rejects: valid
    match:
      src: '[{,][ \t]*(\?[ \t]+)?([&!][^ \t\r\n]*[ \t]+)+("([^"\\]|\\.)*"|''([^'']|'''')*'')[ \t]*:[^ \t\r\n]'
    kind: defect
    because: >-
      the parser rejects a quoted key with node properties in a flow mapping when its value follows the ':' with no
      space: "{!!str "" :x}", "{! 'p':x}" and "{? !!str " ":9}" are rejected, where c-flow-json-node takes
      the properties and c-ns-flow-map-adjacent-value the value; "{"" :x}" and "{!!str "": x}" are accepted
  - id: lone-cr-in-block-scalar
    accepts: invalid
    match:
      src: '[|>][-+0-9]*[ \t]*(#[^\r\n]*)?\r([^\n]|$)'
    kind: defect
    because: >-
      the parser takes a line at column 0 into a top-level block scalar when the lines end in lone CRs, where
      that line ends the scalar: ">-\r .\r5" is accepted with the value " .\n5", and the same document with LF
      breaks is rejected
  - id: explicit-value-compact-key
    accepts: invalid
    match:
      src: '(^|[\r\n])[ ]*:\?[ \t]*(#[^\r\n]*)?(\r|\n|$)'
    kind: defect
    because: >-
      the parser follows [185] s-l+block-indented to the letter after the ':' of an explicit entry: s-indent(0) and a
      compact mapping whose key is a lone '?', so "? a\n:?" is accepted. The '-' of a block sequence entry has a
      lookahead against this, and the ':' has none; the corpus reads the document as invalid, as libfyaml,
      yaml.v3 and go-yaml do
  - id: bom-before-content
    rejects: valid
    match:
      src: '^\x{FEFF}([^-% \t\r\n]|-[^-]|--[^-])'
    kind: defect
    because: >-
      the parser takes a byte order mark before "---", a directive, a space or a break, and rejects one right before
      content or a comment, where [202] l-document-prefix takes it: "\ufeffa: 1" rejects the document
