# The stance of libfyaml: fy-tool gives the verdict and the events, the Python binding the value.
parser: libfyaml
at: parse
because: >-
  fy-tool parses the document and writes its events, which give the verdict; the Python binding builds the value
  afterwards, so its failures do not change the verdict

stands:
  key/duplicate:
    stand: either
    because: >-
      fy-tool writes events without checking for a key written twice, and accepts most documents that write one
  anchor/alias-across-documents:
    stand: either
    because: >-
      libfyaml keeps one anchor table for the whole stream on purpose, so an alias may name an anchor of an earlier
      document. The rule is decided at compose, past the parse fy-tool gives the verdict on
  directive/yaml-minor-version:
    stand: either
    because: fy-tool accepts a %YAML directive for 1.1, 1.2 and 1.3, and rejects one it does not know, such as 1.22
  indentation/tab-opens-content:
    stand: either
    because: >-
      fy-tool rejects a tab opening a top-level block scalar's content in a bare document, "|\n\tx" fails with
      "invalid tab character as indent instead of space", and accepts it after a "---": "--- !!str |\n\tx"

departures:
  - id: indicator-counted-from-0
    rejects: valid
    match:
      message: 'block scalar with wrongly indented|Unsupported directive'
      src: '(^\x{FEFF}?|[\r\n])[ ]*(---[ \t]+)?([&!]\S*[ \t]+)*[|>]([-+]?[1-9]|[1-9][-+]?)'
    kind: defect
    because: >-
      fy-tool counts a top-level block scalar's indentation indicator from column 0. The root node has n = -1
      ([207] l-bare-document), and [170] sets the content indentation to n+m, so "--- |3" holds its content at
      2 spaces, as the column 0 content of example 9.5 needs. After a reserved directive, fy-tool writes the
      warning "Unsupported directive" first, and the indentation error after it
  - id: block-scalar-at-node-column
    rejects: valid
    match:
      message: 'missing document start'
      src: '[|>][-+]?[ \t\r\n#]'
    kind: defect
    because: >-
      fy-tool takes the column of an anchor, or of an indented header, as the indentation of a top-level block
      scalar, so content at or left of that column ends the document: "&a1 |\nx" and "  >-\n x" are rejected,
      where the root's n = -1 lets the content start at column 0
  - id: tab-before-node
    rejects: valid
    match:
      message: 'plain scalar cannot start with'
      src: '(^\x{FEFF}?|[\r\n])\t'
    kind: defect
    because: >-
      fy-tool reads a tab at the start of a line as the start of a plain scalar, so a node property, a quoted
      scalar or a flow collection after it fails, and so does a last line of a tab after a comment:
      "---\n\t&a1 []" is rejected, where s-separate takes the tab
  - id: plain-value-continued
    rejects: valid
    match:
      message: 'invalid multiline plain key'
    kind: defect
    because: >-
      fy-tool reads a plain value continued on a more indented line that starts with '?' as a multi-line key:
      "? a\n: x\n ? b\n: y" is rejected, where s-ns-plain-next-line makes the value "x ? b"
  - id: tab-after-explicit-key
    rejects: valid
    match:
      message: "Indentation used tabs for ':' indicator"
    kind: defect
    because: >-
      fy-tool rejects the ':' of an explicit entry whose '?' a tab follows: "?\ta\n: b" is rejected, where
      s-separate takes the tab before a scalar key
  - id: tab-after-block-entry
    rejects: valid
    match:
      message: 'cannot use tab for indentation of block entry|invalid tab as indendation in a mapping'
    kind: defect
    because: >-
      fy-tool rejects a tab after a '-' before a block scalar header, "-\t>-", and before some scalars in nested
      entries, where s-separate takes the tab

# fy-tool takes some documents the grammar rejects.
  - id: control-chars-unchecked
    accepts: invalid
    match:
      src: '[\x00-\x08\x0B\x0C\x0E-\x1F\x7F\x{0080}-\x{0084}\x{0086}-\x{009F}]'
    kind: leniency
    because: >-
      fy-tool takes a control character that c-printable excludes, in a scalar or a comment: "-1 # \x1e1" is
      accepted
  - id: bom-not-first
    accepts: invalid
    match:
      src: '(?s)^.+\x{FEFF}'
    kind: leniency
    because: fy-tool takes a byte order mark after the first byte, where the grammar allows none
  - id: tag-shorthand-unchecked
    accepts: invalid
    match:
      src: '(^\x{FEFF}?|[\s\[{,])!(?:[A-Za-z0-9-]*!)?[^\s!\[\]{},]*[!\[\]{},][^\s,\]}]'
    kind: leniency
    because: >-
      fy-tool reads a tag shorthand up to the next space, and takes characters ns-tag-char excludes:
      "!!n-1!int -2" is accepted
  - id: anchor-against-flow-indicator
    accepts: invalid
    match:
      src: '[&*][^\s\[\]{},]+[\[\]{}]'
    kind: leniency
    because: >-
      fy-tool ends an anchor name at a flow indicator and reads the node right after it, where the grammar needs a
      separation between the anchor and its node: "&a1{}" is accepted
  - id: plain-question-mark-before-flow-indicator
    accepts: invalid
    match:
      src: '(^|[\[{,:\s])\?[\]},]'
    kind: leniency
    because: >-
      fy-tool reads a lone '?' right before ']', '}' or ',' as the plain scalar "?", where [126] ns-plain-first
      needs an ns-plain-safe character after it and [150] a separation after the '?' indicator: "[?]" is accepted
      as ["?"]
  - id: directives-without-document
    accepts: invalid
    match:
      src: '^\x{FEFF}?%[^\r\n]*(?:[\r\n]+(?:[^-\r\n][^\r\n]*)?)*$'
    kind: leniency
    because: >-
      fy-tool takes a stream of directives that no "---" follows, where l-directive-document needs one: "%YA" is
      accepted

# The Python binding returns numbers past the native ranges as their text.
  - id: wide-integer-as-text
    differs: value
    match: {tags: [representation/integer-wide]}
    kind: position
    because: >-
      the Python binding returns an integer past 64 bits as a string:
      -803850883125972097111 comes back as "-803850883125972097111"
  - id: float-past-double-as-text
    differs: value
    match: {tags: [representation/float-out-of-range]}
    kind: position
    because: the Python binding returns a float past a double's range as a string, "-9.948e-328"
  - id: indicator-counted-from-0-value
    differs: value
    match:
      src: '(^\x{FEFF}?|[\r\n])[ ]*(---[ \t]+)?([&!]\S*[ \t]+)*[|>]([-+]?[1-9]|[1-9][-+]?)'
    kind: defect
    because: >-
      the Python binding counts a top-level block scalar's indentation indicator from column 0, one space deeper
      than n+m with the root's n = -1, so the content loses a leading space: "|3-" over a line of 3 spaces gives
      "" for " "
  - id: float-as-double
    differs: value
    match: {tags: [representation/float-inexact]}
    kind: position
    because: >-
      a float with more digits than a double holds comes back rounded:
      1.143173161916425300746010 comes back as 1.1431731619164254
  - id: explicit-merge-not-applied
    differs: value
    match: {src: '!(?:[A-Za-z0-9-]*!)?merge|2002:merge>'}
    kind: position
    because: >-
      the Python binding does not apply the merge key, even under an explicit !!merge tag, and keeps "<<" as a
      plain key
  - id: ordered-map-as-sequence
    differs: value
    match: {tags: [representation/ordered-map]}
    kind: position
    because: the Python binding has no ordered map, and returns !!omap as a sequence of one-pair mappings
  - id: timestamp-as-text
    differs: value
    match: {tags: [representation/timestamp]}
    kind: position
    because: >-
      the Python binding returns a !!timestamp as the text written, where the corpus states it in RFC 3339 form:
      "1900-10-14" for "1900-10-14T00:00:00Z"
  - id: binary-as-bytes
    differs: value
    match: {tags: [representation/binary]}
    kind: position
    because: >-
      the Python binding decodes !!binary into its bytes, which the runner writes as a string, where the corpus
      states the base64 text: !!binary "Aw==" comes back as "\u0003"
