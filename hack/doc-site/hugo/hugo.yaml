baseURL: https://go-openapi.github.io/conformance-suites/
title: Extended conformance test suites
theme: hugo-relearn
languageCode: en-us

# Enable features
enableEmoji: true
enableGitInfo: true
enableRobotsTXT: true

# Content configuration
contentDir: content

# Output formats
outputs:
  home:
    - html
    - rss
    - print

# Markup configuration
markup:
  goldmark:
    renderer:
      unsafe: true  # Allow raw HTML in markdown
    parser:
      attribute:
        title: true
        block: true
    renderHooks:
      image:
        useEmbedded: always
  highlight:
    codeFences: true
    guessSyntax: false
    lineNos: false
    lineNumbersInTable: false
    noClasses: true
    style: monokai
    tabWidth: 4

# Taxonomies are disabled for now
disableKinds:
  - taxonomy
  - term
# Module mounts
# Following go-swagger pattern: simple mounts for content and assets
module:
  mounts:
    # Custom layouts (override theme if needed)
    - source: layouts
      target: layouts

    # Generated documentation content
    - source: '../../../docs/doc-site'
      target: content

    # Custom SCSS (for theme customization) + logo
    - source: themes/goyaml-assets
      target: assets

    # Custom static files (favicon)
    - source: themes/goyaml-static
      target: static

# Relearn theme parameters
params:
  # Edit links - point at the hand-written content
  editURL: 'https://github.com/go-openapi/conformance-suites/edit/master/docs/doc-site/'
  externalLinkTarget: _blank

  # Repository info
  sourceRepository: 'https://github.com/go-openapi/conformance-suites'

  # Branding
  author:
    name: 'go-openapi maintainers'
  hideAuthorEmail: true

  # Theme customization
  themeVariant:
    - zen-dark
    - relearn-dark
    - relearn-light
  showVisitedLinks: true
  collapsibleMenu: true
  disableBreadcrumb: false
  disableNextPrev: false
  disableLandingPageButton: true
  titleSeparator: '|'

  # Features
  search:
    disable: false
    index:
      disable: false
    page:
      disable: false
    adapter:
      identifier: lunr
  disableLanguageSwitchingButton: true
  disableInlineCopyToClipBoard: false

  # Menu ordering
  ordersectionsby: 'weight'
  # Proposal for enhancement: configure versions
  #versions:
  #- baseURL: https://go-openapi.github.io/conformance-suites/
  #  identifier: v2.1.0
  #  isLatest: true
  #version: 'v2.1.0'

  # Custom params (populated by conformance-suites.yaml)
  conformancesuites:
    goVersion: ''
    latestRelease: ''
    versionMessage: ''
    buildTime: ''

  # Corpus and grammar counts (populated by metrics.yaml)
  metrics:
    json_rules: 0
    yaml_rules: 0
    json_tags: 0
    json_mutations: 0
    json_compact_cases: 0
    json_compact_refused: 0
    json_full_cases: 0
    json_full_size: ''
    json_per_signature: 0
    json_deep_nesting: 0
    json_jts_accept: 0
    json_jts_reject: 0
    json_jts_impl: 0
    json_jts_impl_accepted: 0
    json_constructs: 0

# Menu configuration
menu:
  shortcuts:
    - name: "GitHub"
      identifier: github
      url: "https://github.com/go-openapi/conformance-suites"
      weight: 10

    - name: "go-openapi toolkit"
      identifier: go-openapi
      url: "https://github.com/go-openapi"
      weight: 20

# Privacy settings
privacy:
  disqus:
    disable: true
  googleAnalytics:
    disable: true
