# Corpus and grammar counts for the documentation site.
#
# Hand-maintained. Pages read these with siteparam and never type a count into prose.
# Re-measure before changing a number, and record here which run it came from.
#
# Measured 2026-11-22 against master, with a throwaway test in ./json calling
# jsoncorpus.CompactSuite, jsoncorpus.Full().Write, jsoncorpus.Vocabulary,
# jsoncorpus.MutationNames, jsoncorpus.JSON.Rules and yamlcorpus.YAML.Rules.
params:
    metrics:
        # Grammars: productions compiled.
        json_rules: 33
        yaml_rules: 211

        # JSON suite.
        json_tags: 8            # 4 JSON tags + 4 encoding tags
        json_mutations: 8
        json_compact_cases: 3921    # re-measured 2026-11-23, after the census gaps closed
        json_compact_refused: 1331
        json_full_cases: 144396
        json_full_size: "2.5 MiB"
        json_per_signature: 16      # jsoncorpus.Compact().PerSignature
        json_deep_nesting: 128      # deepEnough in json/tags.go: structure/deep-nesting is past this depth

        # The vendored JSONTestSuite, as TestRecognizerAgreesWithJSONTestSuite scores it, and the census of
        # TestTheGeneratedCorpusIsWiderThanTheSuite. Measured 2026-11-24 with go test -v ./json.
        json_jts_accept: 95         # y_ files, all accepted
        json_jts_reject: 188        # n_ files, all refused
        json_jts_impl: 35           # i_ files, recorded and never asserted
        json_jts_impl_accepted: 21
        json_constructs: 40         # jsoncorpus.Constructs

        # YAML suite. Measured 2026-11-27 on the v0.0.4 compact corpus (yamlembed.CompactSuite, generator
        # yamlcorpus/48), with a throwaway test; the calibration with go test -v ./yaml; the reach with
        # TestTheCorpusReachesMostOfTheGrammar.
        yaml_patches: 13            # len(yamlPatches()) in yaml/yaml.go
        yaml_tags: 66               # len(header.vocabulary)
        yaml_per_signature: 16      # yamlbuild.Compact().PerSignature
        yaml_compact_cases: 28279
        yaml_compact_refused: 8760
        yaml_compact_meanings: 2864         # cases with a meaning
        yaml_compact_meanings_split: 334    # cases with one meaning per reading
        yaml_compact_cyclic: 4
        yaml_buckets: 605           # production-by-context buckets reachable from l-yaml-stream in block-in
        yaml_yts_accept: 299        # YAML Test Suite fixtures that must be accepted
        yaml_yts_reject: 94
        yaml_yts_silent: 9          # fixtures with no expectation
        yaml_yts_departures: 2

        # Extended tiers (x5), measured 2026-11-26 on master 62d0816 with the Build literals the coverage page shows.
        json_extended_cases: 11982
        yaml_extended_cases: 112578
        yaml_extended_size: "6.8 MB"
        # YAML suite page, measured 2026-11-27 on the v0.0.4 compact corpus.
        yaml_mutations: 10          # generic mutations in yamlbuild/mutate.go
        yaml_rule_breaks: 4         # rule-breaking rewrites in yamlbuild/breaking.go and duplicates.go
        yaml_features: 61           # len(header.features)
        yaml_compact_opaque: 1596
        yaml_compact_shapes: 131    # enumerated cases, names starting shape/
        yaml_tags_reject: 11        # tags the spec settles as reject
        yaml_tags_accept: 11        # tags the spec settles as accept
        yaml_tags_open: 44

