# Corpus and grammar counts for the documentation site.
#
# Hand-maintained. Pages read these with siteparam and never type a count into prose.
# Re-measure before changing a number, and record here which run it came from.
#
# Measured 2026-11-22 against master, with a throwaway test in ./json calling
# jsoncorpus.CompactSuite, jsoncorpus.Full().Write, jsoncorpus.Vocabulary,
# jsoncorpus.MutationNames, jsoncorpus.JSON.Rules and yamlcorpus.YAML.Rules.
params:
    metrics:
        # Grammars: productions compiled.
        json_rules: 33
        yaml_rules: 211

        # JSON suite.
        json_tags: 8            # 4 JSON tags + 4 encoding tags
        json_mutations: 8
        json_compact_cases: 3921    # re-measured 2026-11-23, after the census gaps closed
        json_compact_refused: 1331
        json_full_cases: 144396
        json_full_size: "2.5 MiB"
        json_per_signature: 16      # jsoncorpus.Compact().PerSignature
        json_deep_nesting: 128      # deepEnough in json/tags.go: structure/deep-nesting is past this depth

        # The vendored JSONTestSuite, as TestRecognizerAgreesWithJSONTestSuite scores it, and the census of
        # TestTheGeneratedCorpusIsWiderThanTheSuite. Measured 2026-11-24 with go test -v ./json.
        json_jts_accept: 95         # y_ files, all accepted
        json_jts_reject: 188        # n_ files, all refused
        json_jts_impl: 35           # i_ files, recorded and never asserted
        json_jts_impl_accepted: 21
        json_constructs: 40         # jsoncorpus.Constructs
