# Corpus and grammar counts for the documentation site.
#
# Hand-maintained. Pages read these with siteparam and never type a count into prose.
# Re-measure before changing a number, and record here which run it came from.
#
# Measured 2026-11-22 against master, with a throwaway test in ./json calling
# jsoncorpus.SmokeSuite, jsoncorpus.Full().Write, jsoncorpus.Vocabulary,
# jsoncorpus.MutationNames, jsoncorpus.JSON.Rules and grammar.YAML.Rules.
params:
    metrics:
        # Grammars: productions compiled.
        json_rules: 33
        yaml_rules: 211

        # JSON suite.
        json_tags: 7            # 3 JSON tags + 4 encoding tags
        json_mutations: 8
        json_smoke_cases: 1642
        json_smoke_refused: 1323
        json_full_cases: 154358
        json_full_size: "2.2 MiB"
